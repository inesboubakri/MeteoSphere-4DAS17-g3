spring.application.name=ingestion
server.port=8081

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/ingestion_db
spring.data.mongodb.auto-index-creation=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Publier l'état Actuator /health dans Eureka
eureka.client.healthcheck.enabled=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informations affichées par /actuator/info
info.app.name=Ingestion
info.app.version=1.0.0
info.app.description=Microservice de collecte et de stockage des données météorologiques
info.app.team=Equipe MeteoSphere
