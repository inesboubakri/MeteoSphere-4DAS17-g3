# ---------- Service ----------
spring.application.name=signalements-vigilance
server.port=8085

# ---------- MySQL (une base par service) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meteosphere_signalements?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Eureka (Service Provider) ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# le statut Actuator (/actuator/health) est publie dans Eureka
eureka.client.healthcheck.enabled=true

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Signalements & Vigilance
info.app.description=MeteoSphere - signalements citoyens, vigilance par zone, notifications
info.app.version=0.0.1
info.app.team=Blossoms (Sinda Aouay, Ines Boubaker, Khalil Saidi, Wala Bouraoui, Mehdi Hajjouni, Motaz Nasfi)

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Donnees de demonstration ----------
app.seed.enabled=true