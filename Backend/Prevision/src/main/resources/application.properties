# Service
spring.application.name=prevision
server.port=8083
server.servlet.context-path=/api

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# Connexion a la base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/prevision_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator (Observabilite)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
eureka.client.healthcheck.enabled=true
management.info.env.enabled=true

# Informations publiees dans /actuator/info
info.app.name=prevision
info.app.version=1.0.0
info.app.description=Microservice de gestion des previsions meteorologiques
